[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-props"
version = "0.1.0"
description = "Pregame MLB pitcher strikeout projection research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "python-dotenv",
]

[project.optional-dependencies]
research = [
    "joblib",
    "jupyterlab",
    "lightgbm",
    "matplotlib",
    "mlflow",
    "nbconvert",
    "playwright",
    "pybaseball",
    "plotly",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "streamlit",
    "xgboost",
    "optuna",
    "catboost",
]
paper = ["pymupdf", "markdown"]
deploy = ["modal"]
dev = ["pytest", "pre-commit", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires external private-lake artifacts (data parquets, sealed bundle); run explicitly via pytest -m integration, skip-guarded when artifacts are absent",
]
