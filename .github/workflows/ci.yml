name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: superseded PR pushes cancel their earlier run; runs on
# main are never cancelled (audit trail preserved).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache downloaded wheels keyed on pyproject.toml (deps live there,
          # there is no requirements.txt). Cache restores between runs; the
          # install command itself is unchanged and still resolves extras.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # deps live in pyproject.toml (no requirements.txt). Full suite imports
          # numpy/pandas/polars plus joblib/sklearn/lightgbm via live_assembly +
          # prob_calibration collection, scipy for research helpers, and
          # statsmodels for likelihoods (BinomialGLM raises without it).
          python -m pip install ".[dev]" scipy joblib scikit-learn lightgbm statsmodels

      - name: Compile all production scripts
        run: |
          # compileall = syntax check only (no imports executed), equivalent
          # coverage to the previous per-file py_compile loop, in one process.
          # Non-zero exit on any file that fails to compile.
          python -m compileall -q production

      - name: Run full test suite
        run: |
          python -m pytest -q -rs --junitxml=pytest_report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest_report.xml

  tracking:
    # Portable tracking CI lane: the shared-wrapper tracking module is fully
    # synthetic (temp sqlite store; the canonical research mlflow.db and the
    # private lake are never touched) but imports mlflow via importorskip,
    # which silently skipped in the main suite. This job installs mlflow and
    # enforces a NON-VACUOUS result: skips fail, the module must actually run.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies + MLflow
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" scipy joblib scikit-learn lightgbm statsmodels mlflow

      - name: Run the tracking module
        run: |
          python -m pytest tests/test_pregame_pa_tracking.py -q --junitxml=tracking_report.xml

      - name: Enforce zero-skip non-vacuous result
        if: always()
        run: |
          python -c "import xml.etree.ElementTree as ET; s = ET.parse('tracking_report.xml').getroot().find('testsuite'); a = s.attrib; stats = {k: int(a.get(k, 0)) for k in ('tests', 'skipped', 'failures', 'errors')}; print(stats); assert stats['tests'] >= 6, 'tracking module under-collected - the lane must execute the complete module'; assert stats['skipped'] == 0, 'SKIP DETECTED: the tracking module must not silently skip (mlflow importorskip would mask the tracking-coverage gap)'; assert stats['failures'] == 0 and stats['errors'] == 0, 'tracking module red'"
