name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Compile critical production scripts
        run: |
          python -m py_compile production/ops/run_daily.py
          python -m py_compile production/ops/run_monitoring_cycle.py
          python -m py_compile production/ops/log_model_lineage.py
          python -m py_compile production/ops/run_post_score_automation.py
          python -m py_compile production/ops/compare_feature_set_market_skill.py
          python -m py_compile production/ops/edge_floor_sweep_governance.py

      - name: Run focused tests
        run: |
          pytest -q tests/test_registries.py tests/test_pitcher_rolling.py
