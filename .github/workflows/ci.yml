name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # deps live in pyproject.toml (no requirements.txt). Full suite imports
          # numpy/pandas/polars plus joblib/sklearn/lightgbm via live_assembly +
          # prob_calibration collection; scipy for research helpers.
          python -m pip install ".[dev]" scipy joblib scikit-learn lightgbm

      - name: Compile all production scripts
        run: |
          # py_compile = syntax check only (no imports executed), safe for
          # every script under production/ even ones needing polars.
          set -e
          while IFS= read -r f; do
            python -m py_compile "$f"
          done < <(find production -name "*.py" -print)

      - name: Run full test suite
        run: |
          python -m pytest -q
